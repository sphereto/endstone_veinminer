name: Bug Report
description: Report a problem with VeinMiner
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Set activation mode to sneak
        2. Sneak and break an ore block
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Both
    validations:
      required: true
  - type: input
    id: endstone-version
    attributes:
      label: Endstone Version
      placeholder: "0.11"
  - type: input
    id: veinminer-version
    attributes:
      label: VeinMiner Version
      placeholder: "1.0.0"
